# Render Blueprint：GitHub 仓库检测到该文件后可一键部署
services:
  - type: web
    name: xiyuan-xiaozhi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false   # 部署后在面板 Secrets 中填写
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: EMBED_DEVICE
        value: cpu
